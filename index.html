<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametrik Çekmece Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; color: white; }
        #canvas-container { width: 100%; height: 100vh; }
        /* Scrollbar gizleme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
    <!-- Three.js ve Eklentilerini CDN üzerinden import ediyoruz -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="flex h-screen font-sans">

    <!-- Sol Panel: Ayarlar -->
    <div class="w-80 p-6 bg-gray-800 overflow-y-auto border-r border-gray-700 flex flex-col gap-5 z-10 shadow-2xl relative">
        <h1 class="text-xl font-bold text-blue-400">Organizer Üreteci</h1>
        
        <div class="flex flex-col">
            <label class="text-sm mb-1 text-gray-300">Genişlik / X (mm)</label>
            <input type="number" id="inp-width" value="200" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div class="flex flex-col">
            <label class="text-sm mb-1 text-gray-300">Derinlik / Y (mm)</label>
            <input type="number" id="inp-depth" value="150" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div class="flex flex-col">
            <label class="text-sm mb-1 text-gray-300">Yükseklik / Z (mm)</label>
            <input type="number" id="inp-height" value="50" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div class="flex flex-col">
            <label class="text-sm mb-1 text-gray-300">Duvar Kalınlığı (mm)</label>
            <input type="number" id="inp-wall" value="1.2" step="0.4" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        
        <div class="flex gap-4 mt-2">
            <div class="flex flex-col w-1/2">
                <label class="text-sm mb-1 text-gray-300">Sütun Sayısı</label>
                <input type="number" id="inp-cols" value="3" min="1" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex flex-col w-1/2">
                <label class="text-sm mb-1 text-gray-300">Satır Sayısı</label>
                <input type="number" id="inp-rows" value="3" min="1" class="bg-gray-700 rounded p-2 text-white outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-700">
            <label class="flex items-center justify-between cursor-pointer group">
                <span class="text-sm text-gray-300 group-hover:text-white transition-colors">Tabansız Izgara</span>
                <input type="checkbox" id="chk-bottomless" class="w-5 h-5 rounded bg-gray-700 border-gray-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-gray-800">
            </label>
        </div>

        <button id="btn-export" class="mt-auto py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-lg font-bold transition-colors shadow-lg">
            STL Olarak İndir
        </button>
    </div>

    <!-- Sağ Panel: 3D Önizleme -->
    <div id="canvas-container" class="flex-1 relative cursor-move"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        // 1. Sahne, Kamera ve Render Kurulumu
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#111827'); 

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 2000);
        camera.position.set(200, 250, 250);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 300, 150);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Zemin Izgarası (Grid)
        const gridHelper = new THREE.GridHelper(600, 60, 0x444444, 0x222222);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        // 4. Model Grubu ve Materyal
        let organizerGroup = new THREE.Group();
        scene.add(organizerGroup);

        const material = new THREE.MeshStandardMaterial({ 
            color: 0x3b82f6, 
            roughness: 0.5, 
            metalness: 0.1 
        });

        // 5. Parametrik Model Oluşturma Fonksiyonu
        function createOrganizer() {
            while(organizerGroup.children.length > 0){ 
                organizerGroup.remove(organizerGroup.children[0]); 
            }

            const w = parseFloat(document.getElementById('inp-width').value);
            const d = parseFloat(document.getElementById('inp-depth').value);
            const h = parseFloat(document.getElementById('inp-height').value);
            const wall = parseFloat(document.getElementById('inp-wall').value);
            const cols = parseInt(document.getElementById('inp-cols').value) || 1;
            const rows = parseInt(document.getElementById('inp-rows').value) || 1;
            const bottomless = document.getElementById('chk-bottomless').checked;

            const baseThickness = bottomless ? 0 : wall;
            const innerH = h - baseThickness;
            const yCenter = baseThickness + innerH / 2;

            const addPart = (size, pos) => {
                const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(pos[0], pos[1], pos[2]);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                organizerGroup.add(mesh);
            };

            if (!bottomless) {
                addPart([w, baseThickness, d], [0, baseThickness / 2, 0]);
            }

            addPart([wall, innerH, d], [-(w / 2 - wall / 2), yCenter, 0]); 
            addPart([wall, innerH, d], [(w / 2 - wall / 2), yCenter, 0]);  
            addPart([w - wall * 2, innerH, wall], [0, yCenter, -(d / 2 - wall / 2)]); 
            addPart([w - wall * 2, innerH, wall], [0, yCenter, (d / 2 - wall / 2)]);  

            const stepX = (w - wall * 2) / cols;
            for (let i = 1; i < cols; i++) {
                const posX = -(w / 2 - wall) + (i * stepX);
                addPart([wall, innerH, d - wall * 2], [posX, yCenter, 0]);
            }

            const stepZ = (d - wall * 2) / rows;
            for (let i = 1; i < rows; i++) {
                const posZ = -(d / 2 - wall) + (i * stepZ);
                addPart([w - wall * 2, innerH, wall], [0, yCenter, posZ]);
            }
        }

        // 6. Olay Dinleyicileri (Event Listeners)
        const inputIds = ['inp-width', 'inp-depth', 'inp-height', 'inp-wall', 'inp-cols', 'inp-rows', 'chk-bottomless'];
        inputIds.forEach(id => {
            document.getElementById(id).addEventListener('input', createOrganizer);
        });

        createOrganizer();

        // 7. STL Export İşlemi
        document.getElementById('btn-export').addEventListener('click', () => {
            const exporter = new STLExporter();
            const stlString = exporter.parse(organizerGroup);
            const blob = new Blob([stlString], { type: 'text/plain' });
            
            const w = document.getElementById('inp-width').value;
            const d = document.getElementById('inp-depth').value;
            const h = document.getElementById('inp-height').value;
            
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = URL.createObjectURL(blob);
            link.download = `organizer_${w}x${d}x${h}mm.stl`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 8. Animasyon ve Render Döngüsü
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 9. Ekran Boyutu Değişimi
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
